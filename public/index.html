<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QVAC Acronym Generator</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #f4f6f8;
    font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    color: #1f2937;
    display: flex;
    justify-content: center;
    padding: 40px 20px;
  }
  .wrap { width: 100%; max-width: 480px; }
  h1 { font-size: 1.5rem; margin: 0 0 6px; }
  .subtitle { color: #6b7280; margin-bottom: 20px; font-size: 0.9rem; }
  .card {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    padding: 24px;
  }
  input[type=text] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #d1d5db;
    font-family: inherit;
    font-size: 1rem;
    margin-bottom: 14px;
  }
  button.action {
    padding: 10px 22px;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    background: #dc2626;
    color: #fff;
  }
  button.action:disabled { opacity: 0.5; cursor: not-allowed; }
  .status { margin-top: 12px; font-size: 0.85rem; color: #6b7280; min-height: 1.2em; }
  .result-list { margin-top: 16px; list-style: none; padding: 0; display: none; }
  .result-list li {
    background: #fef2f2;
    border: 1px solid #fecaca;
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: #b91c1c;
  }
  .footer-note { color: #9ca3af; font-size: 0.78rem; margin-top: 20px; text-align: center; }
  .spinner {
    display: inline-block;
    width: 12px; height: 12px;
    border: 2px solid #fecaca;
    border-top-color: #dc2626;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="wrap">
    <h1>QVAC Acronym Generator</h1>
    <p class="subtitle">Enter a phrase, get acronym options from its real words. 100% on-device.</p>

    <div class="card">
      <input type="text" id="mainInput" placeholder="e.g. Quick Value Add Checker" />
      <button class="action" id="generateBtn">Build Acronyms</button>
      <div class="status" id="status"></div>
      <ul class="result-list" id="resultList"></ul>
    </div>

    <p class="footer-note">Everything runs locally on your machine. No text ever leaves this device.</p>
  </div>

  <script>
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    const mainInput = document.getElementById('mainInput');
    const generateBtn = document.getElementById('generateBtn');
    const status = document.getElementById('status');
    const resultList = document.getElementById('resultList');

    async function generate() {
      const value = mainInput.value.trim();
      if (!value) return;
      generateBtn.disabled = true;
      resultList.style.display = 'none';
      resultList.innerHTML = '';
      status.innerHTML = '<span class="spinner"></span>Building acronyms...';

      try {
        const res = await fetch('/api/acronym', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phrase: value }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        status.textContent = '';
        if (!data.acronyms || data.acronyms.length === 0) {
          status.textContent = 'Could not build an acronym from that phrase — try adding more words.';
          return;
        }
        resultList.innerHTML = data.acronyms.map((a) => `<li>${escapeHtml(a)}</li>`).join('');
        resultList.style.display = 'block';
      } catch (err) {
        status.textContent = 'Error: ' + err.message;
      } finally {
        generateBtn.disabled = false;
      }
    }

    generateBtn.addEventListener('click', generate);
    mainInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') generate(); });
  </script>
</body>
</html>
